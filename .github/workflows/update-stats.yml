name: Update Stats

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and write docs/stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          # Traffic API needs a PAT; fall back to existing values when unavailable
          VIEWS=$(curl -s "${AUTH[@]}" "$API/traffic/views")
          CLONES=$(curl -s "${AUTH[@]}" "$API/traffic/clones")

          if ! echo "$VIEWS" | jq -e '.count' > /dev/null 2>&1; then
            VIEWS=$(jq '.views' docs/stats.json 2>/dev/null || echo '{"count":0,"uniques":0}')
          fi
          if ! echo "$CLONES" | jq -e '.count' > /dev/null 2>&1; then
            CLONES=$(jq '.clones' docs/stats.json 2>/dev/null || echo '{"count":0,"uniques":0}')
          fi

          # Releases endpoint is public - no auth needed
          RELEASES=$(curl -s "https://api.github.com/repos/$REPO/releases")
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json
          git diff --staged --quiet || git commit -m "chore: update stats [skip ci]"
          git push
