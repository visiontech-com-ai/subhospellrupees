name: Update Stats

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and write docs/stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          T_AUTH=(-H "Authorization: Bearer $TRAFFIC_TOKEN" -H "Accept: application/vnd.github+json")

          VIEWS=$(curl -s "${T_AUTH[@]}" "$API/traffic/views")
          CLONES=$(curl -s "${T_AUTH[@]}" "$API/traffic/clones")

          if ! echo "$VIEWS" | jq -e '.count' > /dev/null 2>&1; then
            VIEWS=$(jq '.views' docs/stats.json 2>/dev/null || echo '{"count":0,"uniques":0}')
          fi
          if ! echo "$CLONES" | jq -e '.count' > /dev/null 2>&1; then
            CLONES=$(jq '.clones' docs/stats.json 2>/dev/null || echo '{"count":0,"uniques":0}')
          fi

          RELEASES=$(curl -s "https://api.github.com/repos/$REPO/releases")

          jq -n \
            --argjson v  "$(echo "$VIEWS"   | jq '{count:.count, uniques:.uniques}')" \
            --argjson c  "$(echo "$CLONES"  | jq '{count:.count, uniques:.uniques}')" \
            --argjson dl "$(echo "$RELEASES" | jq '[.[].assets[].download_count] | add // 0')" \
            --arg up "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{views:$v, clones:$c, downloads:$dl, updated:$up}' \
            > docs/stats.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json
          git diff --staged --quiet || git commit -m "chore: update stats [skip ci]"
          git push
